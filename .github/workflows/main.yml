name: Build LifeDesk APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK 组件
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          MGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$MGR" ]; then MGR="$(command -v sdkmanager)"; fi
          yes | "$MGR" --licenses > /dev/null 2>&1 || true
          "$MGR" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: 编译 Debug 版 APK
        run: |
          set -e
          if ! command -v gradle > /dev/null 2>&1; then
            curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.2-bin.zip
            unzip -q /tmp/gradle.zip -d /opt
            echo "/opt/gradle-8.2/bin" >> "$GITHUB_PATH"
            export PATH="/opt/gradle-8.2/bin:$PATH"
          fi
          cd LifeDeskApp-APK
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 上传编译好的 APK
        uses: actions/upload-artifact@v4
        with:
          name: lifedesk-apk
          path: LifeDeskApp-APK/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
